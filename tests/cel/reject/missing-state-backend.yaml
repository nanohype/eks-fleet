# Omitting stateBucket/stateRegion must be denied at admission. The pair rides the
# Workspace initArgs, which tofu only resolves twenty minutes into the vend, so a
# value that is merely present — inherited, defaulted — fails `tofu init` with a
# message that names a bucket rather than the field that chose it. Presence is not
# truth: `required` with no default makes omission a rejection here, and the
# non-empty CEL rule (see empty-state-backend.yaml) covers present-but-blank.
# EXPECT: spec.stateBucket
apiVersion: fleet.nanohype.dev/v1alpha1
kind: Cluster
metadata:
  name: reject-missing-state-backend
  namespace: platform
spec:
  account: "111111111111"
  region: us-east-1
  environment: development
  clusterName: eks
  team: platform
  # stateBucket + stateRegion omitted entirely -> rejected as missing required fields
