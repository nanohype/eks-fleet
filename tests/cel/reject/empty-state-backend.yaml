# stateBucket + stateRegion complete the entrypoint's partial `backend "s3" {}` via
# the Workspace initArgs, which tofu resolves long after admission. A blanked value
# renders `-backend-config=bucket=` and fails `tofu init` with a message naming
# neither the Cluster nor the empty field, so the XRD's CEL rule must reject it at
# admission.
#
# `required` catches omission; this fixture covers the half `required` does not —
# present but blank. stateRegion is set to a real value here on purpose: if it were
# omitted, this Cluster would be denied for the missing field rather than for the
# CEL rule, and the test would pass while proving nothing about the rule it names.
# EXPECT: stateBucket and stateRegion must be non-empty
apiVersion: fleet.nanohype.dev/v1alpha1
kind: Cluster
metadata:
  name: reject-empty-state-backend
  namespace: platform
spec:
  account: "111111111111"
  region: us-east-1
  environment: development
  clusterName: eks
  team: platform
  stateBucket: ""
  stateRegion: us-east-1
