# stateBucket + stateRegion complete the entrypoint's partial `backend "s3" {}` via
# the Workspace initArgs, which tofu resolves long after admission. An explicitly
# blanked value renders `-backend-config=bucket=` and fails `tofu init` with a
# message naming neither the Cluster nor the empty field, so the XRD's CEL rule must
# reject it at admission. Both fields default non-empty; only an explicit blanking
# reaches this rule.
# EXPECT: stateBucket and stateRegion must be non-empty
apiVersion: fleet.nanohype.dev/v1alpha1
kind: Cluster
metadata:
  name: reject-empty-state-backend
  namespace: platform
spec:
  account: "111111111111"
  region: us-east-1
  environment: development
  clusterName: eks
  team: platform
  stateBucket: ""
  # stateRegion left at its default; blanking either one is enough to be rejected
